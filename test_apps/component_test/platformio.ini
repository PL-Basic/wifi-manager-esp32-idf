[platformio]
core_dir = ../../../.platformio-core
src_dir = main
default_envs = h1-esp32dev
build_dir = .pio/build
build_cache_dir = .pio/cache

[env:h1-esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
board_upload.flash_size = 2MB
board_build.partitions = partitions_h1.csv
monitor_speed = 115200
